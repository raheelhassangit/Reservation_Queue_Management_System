{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="flex bg-white rounded-2xl shadow overflow-hidden max-w-4xl mx-auto">
    <div class="hidden md:block w-1/2">
        <img src="{% static 'images/auth.jpg' %}" alt="" class="h-full w-full object-cover">
    </div>
    <div class="w-full md:w-1/2 p-8">
        <h2 class="text-2xl font-semibold text-maroon mb-6">Welcome back</h2>
        <form id="login-form" class="space-y-4">
            <input type="text" id="username" placeholder="Username" required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold">
            <input type="password" id="password" placeholder="Password" required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gold">
            <button type="submit" class="w-full bg-maroon text-white rounded py-2 hover:bg-maroon-dark">
                Login
            </button>
        </form>
        <p id="error" class="text-red-600 text-sm mt-2"></p>
        <p class="text-sm text-gray-500 mt-4">No account? <a href="/register/" class="text-maroon font-medium hover:underline">Register</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const res = await fetch(API_BASE + "/token/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    }),
  });
  if (res.ok) {
    saveTokens(await res.json());
    window.location.href = "/offerings/";
  } else {
    document.getElementById("error").textContent = "Invalid credentials";
  }
});
</script>
{% endblock %}
