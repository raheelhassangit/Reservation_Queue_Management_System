{% extends "base.html" %}
{% load static %}
{% block title %}Browse Offerings | ReserveX AI{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl">
    <div class="mb-8">
        <p class="text-xs font-semibold uppercase tracking-[.18em] text-[#975b3d]">Browse</p>
        <h1 class="mt-1 text-3xl font-semibold text-[#17202a]">What are you planning?</h1>
    </div>

    <div class="mb-6 flex flex-wrap gap-3">
        <input id="search-input" type="text" placeholder="Search by name..."
            class="flex-1 min-w-[200px] rounded-xl border border-[#d9d2c8] px-4 py-2.5 text-sm outline-none focus:border-[#975b3d] focus:ring-2 focus:ring-[#d8b46c]/35">

        <select id="category-filter"
            class="rounded-xl border border-[#d9d2c8] px-4 py-2.5 text-sm outline-none focus:border-[#975b3d] focus:ring-2 focus:ring-[#d8b46c]/35">
            <option value="">All categories</option>
            <option value="bus">Bus</option>
            <option value="course">Course</option>
            <option value="event">Event</option>
            <option value="appointment">Appointment</option>
            <option value="other">Other</option>
        </select>

        <select id="ordering-select"
            class="rounded-xl border border-[#d9d2c8] px-4 py-2.5 text-sm outline-none focus:border-[#975b3d] focus:ring-2 focus:ring-[#d8b46c]/35">
            <option value="-created_at">Newest first</option>
            <option value="total_seats">Seats: low to high</option>
            <option value="-total_seats">Seats: high to low</option>
            <option value="-available_count">Most available</option>
        </select>
    </div>

    <div id="offering-grid" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
    <p id="empty" class="hidden text-center text-[#56616a] py-16">No offerings match your filters.</p>

    <div id="pagination" class="mt-8 flex items-center justify-center gap-4 text-sm"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
let nextUrl = null;
let prevUrl = null;

function offeringCard(o) {
    const when = o.starts_at ? new Date(o.starts_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
    const place = (o.origin && o.destination) ? `${o.origin} → ${o.destination}` : o.location;

    return `
    <a href="/offerings/${o.id}/" class="block rounded-[1.5rem_.5rem_1.5rem_.5rem] border border-[#d9d2c8] bg-white p-6 hover:-translate-y-1 hover:shadow-[0_12px_28px_rgba(27,36,45,.08)] transition">
        <span class="text-xs font-semibold uppercase tracking-[.15em] text-[#975b3d]">${o.category_display}</span>
        <h3 class="mt-2 text-xl font-semibold text-[#17202a]">${o.name}</h3>
        <p class="mt-1 text-xs text-[#899198]">${o.organization_name}</p>
        ${place ? `<p class="mt-2 text-sm text-[#56616a]"> ${place}</p>` : ""}
        ${when ? `<p class="text-sm text-[#56616a]"> ${when}</p>` : ""}
        <p class="mt-2 text-sm font-semibold text-[#6d3032]">Rs. ${Number(o.price).toLocaleString()}</p>
        <p class="mt-1 text-sm text-[#56616a]">${o.available_seats} / ${o.total_seats} seats available</p>
    </a>`;
}

function buildQuery(page = 1) {
    const params = new URLSearchParams();
    const search = document.getElementById("search-input").value.trim();
    const category = document.getElementById("category-filter").value;
    const ordering = document.getElementById("ordering-select").value;

    if (search) params.set("search", search);
    if (category) params.set("category", category);
    if (ordering) params.set("ordering", ordering);
    params.set("page", page);
    return params.toString();
}

async function loadOfferings(page = 1) {
    currentPage = page;
    const res = await fetch(`${API_BASE}/offerings/?${buildQuery(page)}`);
    const data = await res.json();

    const offerings = data.results || [];
    document.getElementById("empty").classList.toggle("hidden", offerings.length > 0);
    document.getElementById("offering-grid").innerHTML = offerings.map(offeringCard).join("");

    nextUrl = data.next;
    prevUrl = data.previous;
    renderPagination(data.count);
}

function renderPagination(count) {
    const pageSize = 10;
    const totalPages = Math.max(1, Math.ceil(count / pageSize));
    document.getElementById("pagination").innerHTML = `
        <button id="prev-btn" ${!prevUrl ? "disabled" : ""}
            class="rounded-full border border-[#d9d2c8] px-4 py-2 font-medium ${prevUrl ? "text-[#29313a] hover:bg-[#f2ede5]" : "text-[#c3bcb2] cursor-not-allowed"}">
            ← Prev
        </button>
        <span class="text-[#56616a]">Page ${currentPage} of ${totalPages}</span>
        <button id="next-btn" ${!nextUrl ? "disabled" : ""}
            class="rounded-full border border-[#d9d2c8] px-4 py-2 font-medium ${nextUrl ? "text-[#29313a] hover:bg-[#f2ede5]" : "text-[#c3bcb2] cursor-not-allowed"}">
            Next →
        </button>`;

    document.getElementById("prev-btn")?.addEventListener("click", () => {
        if (prevUrl) loadOfferings(currentPage - 1);
    });
    document.getElementById("next-btn")?.addEventListener("click", () => {
        if (nextUrl) loadOfferings(currentPage + 1);
    });
}

const urlParams = new URLSearchParams(window.location.search);
const initialCategory = urlParams.get("category");
if (initialCategory) {
    document.getElementById("category-filter").value = initialCategory;
}

document.getElementById("search-input").addEventListener("input", debounce(() => loadOfferings(1), 400));
document.getElementById("category-filter").addEventListener("change", () => loadOfferings(1));
document.getElementById("ordering-select").addEventListener("change", () => loadOfferings(1));

function debounce(fn, delay) {
    let timer;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}

loadOfferings(1);
</script>
{% endblock %}
