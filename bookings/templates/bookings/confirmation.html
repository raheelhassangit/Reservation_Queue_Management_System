{% extends "base.html" %}
{% load static %}
{% block title %}Booking Confirmed | ReserveX AI{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="rounded-[1.5rem_.5rem_1.5rem_.5rem] border border-[#d9d2c8] bg-white p-8 text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[#eef6ee]">
            <span class="text-2xl text-[#2f7a3c]">✓</span>
        </div>
        <h1 class="mt-5 text-2xl font-semibold text-[#17202a]">Booking confirmed</h1>
        <p class="mt-2 text-sm text-[#56616a]">Your seats are reserved. Details below.</p>

        <div id="booking-details" class="mt-7 rounded-xl border border-[#eee9e2] bg-[#f5eee4] p-5 text-left"></div>

        <div class="mt-7 flex gap-3">
            <a href="/bookings/mine/" class="flex-1 rounded-full bg-[#6d3032] px-5 py-3 text-sm font-semibold text-white hover:bg-[#4a1f25]">
                My Bookings
            </a>
            <a href="/offerings/" class="flex-1 rounded-full border border-[#d9d2c8] px-5 py-3 text-sm font-semibold text-[#29313a] hover:bg-[#f2ede5]">
                Browse More
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const bookingId = window.location.pathname.split("/").filter(Boolean)[1];

async function loadBooking() {
    const res = await apiFetch(`/bookings/${bookingId}/`);
    if (!res.ok) { window.location.href = "/bookings/mine/"; return; }
    const b = await res.json();

    const date = new Date(b.created_at).toLocaleString(undefined, {
        dateStyle: "medium", timeStyle: "short"
    });

    document.getElementById("booking-details").innerHTML = `
        <div class="flex justify-between py-2 border-b border-[#e3dccf] text-sm">
            <span class="text-[#56616a]">Offering</span>
            <span class="font-semibold text-[#17202a]">${b.offering_name}</span>
        </div>
        <div class="flex justify-between py-2 border-b border-[#e3dccf] text-sm">
            <span class="text-[#56616a]">Seats</span>
            <span class="font-semibold text-[#17202a]">${b.seats.join(", ")}</span>
        </div>
        <div class="flex justify-between py-2 border-b border-[#e3dccf] text-sm">
            <span class="text-[#56616a]">Total paid</span>
            <span class="font-semibold text-[#17202a]">Rs. ${Number(b.total_price).toLocaleString()}</span>
        </div>
        <div class="flex justify-between py-2 text-sm">
            <span class="text-[#56616a]">Booked on</span>
            <span class="font-semibold text-[#17202a]">${date}</span>
        </div>
    `;
}

loadBooking();
</script>
{% endblock %}
