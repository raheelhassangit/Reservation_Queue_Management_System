{% extends "base.html" %}
{% load static %}
{% block title %}My Bookings | ReserveX AI{% endblock %}

{% block content %}
<div class="mx-auto max-w-4xl">
    <div class="mb-8">
        <p class="text-xs font-semibold uppercase tracking-[.18em] text-[#975b3d]">Your Account</p>
        <h1 class="mt-1 text-3xl font-semibold text-[#17202a]">My Bookings</h1>
    </div>

    <div id="booking-list" class="space-y-4"></div>
    <p id="empty" class="hidden text-center text-[#56616a] py-16">
        You haven't booked anything yet — <a href="/offerings/" class="text-[#6d3032] font-semibold hover:underline">browse offerings</a>.
    </p>

    <div id="pagination" class="hidden mt-8 flex items-center justify-center gap-4">
        <button id="prev-btn" type="button"
                class="rounded-full border border-[#d9d2c8] px-5 py-2 text-sm font-semibold text-[#6d3032] hover:bg-[#f2ede5] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent">
            ← Previous
        </button>
        <span id="page-info" class="text-sm text-[#56616a]"></span>
        <button id="next-btn" type="button"
                class="rounded-full border border-[#d9d2c8] px-5 py-2 text-sm font-semibold text-[#6d3032] hover:bg-[#f2ede5] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent">
            Next →
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const PAGE_SIZE = 10; // must match PAGE_SIZE in settings.py
let currentPage = parseInt(new URLSearchParams(location.search).get("page")) || 1;

function bookingCard(b) {
    const seatList = b.seats.join(", ");
    const date = new Date(b.created_at).toLocaleString(undefined, {
        dateStyle: "medium", timeStyle: "short"
    });

    const statusBadge = b.offering_active
        ? ""
        : `<span class="ml-2 rounded-full bg-[#f8eeee] px-2.5 py-0.5 text-xs font-semibold text-[#8d3034]">No longer active</span>`;

    return `
    <div class="rounded-[1.5rem_.5rem_1.5rem_.5rem] border border-[#d9d2c8] bg-white p-6 flex items-center justify-between gap-4 flex-wrap ${!b.offering_active ? "opacity-75" : ""}">
        <div>
            <h3 class="text-lg font-semibold text-[#17202a] inline-flex items-center">${b.offering_name}${statusBadge}</h3>
            <p class="mt-1 text-sm text-[#56616a]">Seats: ${seatList}</p>
            <p class="mt-1 text-sm font-semibold text-[#6d3032]">Rs. ${Number(b.total_price).toLocaleString()}</p>
            <p class="mt-1 text-xs text-[#899198]">Booked ${date}</p>
        </div>
        ${b.offering_active
            ? `<a href="/offerings/${b.offering}/" class="rounded-full border border-[#d9d2c8] px-4 py-2 text-sm font-semibold text-[#6d3032] hover:bg-[#f2ede5]">View offering</a>`
            : `<span class="rounded-full border border-[#d9d2c8] px-4 py-2 text-sm font-semibold text-[#899198] cursor-not-allowed">Unavailable</span>`
        }
    </div>`;
}

async function guardCustomer() {
    const res = await apiFetch("/accounts/me/");
    if (!res.ok) return null;
    const user = await res.json();
    if (user.role !== "customer") { window.location.href = "/"; return null; }
    return user;
}

function renderPagination(data, page, count) {
    const totalPages = Math.max(1, Math.ceil(count / PAGE_SIZE));
    document.getElementById("pagination").classList.toggle("hidden", totalPages <= 1);
    document.getElementById("page-info").textContent = `Page ${page} of ${totalPages}`;
    document.getElementById("prev-btn").disabled = !data.previous;
    document.getElementById("next-btn").disabled = !data.next;
}

async function loadBookings(page = 1) {
    const res = await apiFetch(`/bookings/?page=${page}`);

    if (!res.ok) {
        // DRF returns 404 for an out-of-range page (e.g. stale ?page=9) -> fall back to page 1
        if (res.status === 404 && page > 1) return loadBookings(1);
        return;
    }

    const data = await res.json();
    const bookings = data.results || data;       // paginated {results} or plain list
    const count = data.count ?? bookings.length;
    currentPage = page;

    document.getElementById("empty").classList.toggle("hidden", count > 0);
    document.getElementById("booking-list").innerHTML = bookings.map(bookingCard).join("");
    renderPagination(data, page, count);

    history.replaceState(null, "", page === 1 ? location.pathname : `?page=${page}`);
    window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("prev-btn").addEventListener("click", () => loadBookings(currentPage - 1));
document.getElementById("next-btn").addEventListener("click", () => loadBookings(currentPage + 1));

(async () => {
    const user = await guardCustomer();
    if (user) loadBookings(currentPage);
})();
</script>
{% endblock %}
